services:
  gatus:
    image: ghcr.io/twin/gatus:stable
    container_name: stackpulse-gatus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    volumes:
      - ./monitoring/config:/config:ro
      - gatus-data:/data

volumes:
  gatus-data: